# Standard Dependabot configuration provisioned by project-baseline.
# Provisioned to each managed repo as .github/dependabot.yml and kept in
# alignment via the sync path (Dependabot has no central `extends` mechanism).
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    commit-message:
      prefix: ":dependabot: github-actions"
      include: "scope"
    groups:
      all-github-actions:
        patterns:
          - "*"
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "daily"
    commit-message:
      prefix: ":dependabot: docker"
      include: "scope"
    groups:
      all-docker:
        patterns:
          - "*"
    ignore:
      - dependency-name: "node"
        versions:
          - ">= 25"
  - package-ecosystem: "npm"
    directory: "/" # Location of package manifests
    schedule:
      interval: "daily"
    commit-message:
      prefix: ":dependabot: npm"
      include: "scope"
    groups:
      all-npm:
        patterns:
          - "*"

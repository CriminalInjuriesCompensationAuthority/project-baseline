name: CI

# project-baseline's own CI. Uses its OWN reusable workflow via a LOCAL ref (./...),
# since a repo can call a reusable workflow defined in itself. Targets the tooling/ package.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/node-ci.yml
    with:
      node-version: "24.15.0"
      working-directory: "tooling"
      run-audit: false

name: CI

# project-baseline's own CI: lints and tests the tooling/ package.
# Actions pinned to tags; Dependabot will convert to SHAs (see note in library CI).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tooling:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tooling
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: "npm"
          cache-dependency-path: tooling/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (Biome)
        run: npm run lint

      - name: Test (node:test + c8)
        run: npm test

name: Release

# Tag-based release for libraries consumed via github: semver refs.
# Publishes a GitHub Release + vX.Y.Z tag — NOT an npm-registry publish.
# Trigger: manual dispatch with the version to cut, after it has been merged to the default branch.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semver to release, e.g. 3.2.2 (a v-prefixed tag will be created)"
        required: true
        type: string

permissions:
  contents: write   # create tag + GitHub Release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 #v7.0.0
        with:
          node-version: "24.15.0"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify package.json version matches requested version
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "${{ inputs.version }}" ]; then
            echo "package.json version ($PKG_VERSION) != requested (${{ inputs.version }})"
            echo "Bump package.json and merge before releasing."
            exit 1
          fi

      - name: Quality gate (lint, test, audit)
        run: npm run prepush

      - name: Build distributable
        run: npm run build

      - name: Create and push tag
        env:
          TAG: "v${{ inputs.version }}"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists"; exit 1
          fi
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: "v${{ inputs.version }}"
        run: gh release create "$TAG" --generate-notes --title "$TAG"

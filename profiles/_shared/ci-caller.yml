name: CI

# Thin caller — delegates to the central reusable pipeline in project-baseline.
# The CI logic lives there, not here, so pipeline changes don't require editing this repo
# (only the pinned ref below is bumped, via sync). See design.md "Shared CI/CD".

on:
  pull_request:
  push:
    branches: [{{DEFAULT_BRANCH}}]

permissions:
  contents: read

jobs:
  ci:
    uses: CriminalInjuriesCompensationAuthority/project-baseline/.github/workflows/node-ci.yml@{{BASELINE_REF}}
    with:
      node-version: "24.15.0"
      working-directory: "{{CI_WORKDIR}}"
